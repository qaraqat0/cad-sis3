AWSTemplateFormatVersion: "2010-09-09"
Description: SIS 3 - app stack (ECS Fargate service behind an ALB, two separate roles, CloudWatch logs with retention)

Parameters:
  ProjectName:
    Type: String
    Default: sis3
    AllowedPattern: "^[a-z][a-z0-9-]{1,19}$"
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  ImageTag:
    Type: String
    Description: Immutable image tag in ECR (deploy.sh passes the git commit)
  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]

Resources:
  # ---------- Load balancer ----------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets:
        - !ImportValue
          Fn::Sub: "${ProjectName}-PublicSubnet1"
        - !ImportValue
          Fn::Sub: "${ProjectName}-PublicSubnet2"
      SecurityGroups:
        - !ImportValue
          Fn::Sub: "${ProjectName}-AlbSg"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      VpcId: !ImportValue
        Fn::Sub: "${ProjectName}-VpcId"
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "15"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------- Logs ----------
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-app"
      RetentionInDays: !Ref LogRetentionDays

  # ---------- Two separate roles ----------
  # 1) Execution role: used by the ECS agent to pull the image and write logs
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

  # 2) Task role: used by OUR code inside the container - only publish to our topic
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: publish-order-events
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !ImportValue
                  Fn::Sub: "${ProjectName}-TopicArn"

  # ---------- ECS ----------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-app"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: ARM64
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub
            - "${RepoUri}:${ImageTag}"
            - RepoUri: !ImportValue
                Fn::Sub: "${ProjectName}-RepoUri"
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: TOPIC_ARN
              Value: !ImportValue
                Fn::Sub: "${ProjectName}-TopicArn"
            - Name: APP_ENV
              Value: !Ref Environment
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Sub "${ProjectName}-svc"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED # public subnets, no NAT gateway (cost)
          Subnets:
            - !ImportValue
              Fn::Sub: "${ProjectName}-PublicSubnet1"
            - !ImportValue
              Fn::Sub: "${ProjectName}-PublicSubnet2"
          SecurityGroups:
            - !ImportValue
              Fn::Sub: "${ProjectName}-TaskSg"
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  AppUrl:
    Value: !Sub "http://${LoadBalancer.DNSName}"
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroup:
    Value: !Ref AppLogGroup
