AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Practice 7 - one-time bootstrap for CI/CD. GitHub OIDC identity provider, a deploy role
  that only the "production" environment of one repository can assume, and a CloudFormation
  execution role that actually creates the SIS 3 resources. No access keys anywhere.

Parameters:
  GitHubOwner:
    Type: String
    Default: qaraqat0
  GitHubOwnerId:
    Type: String
    AllowedPattern: "^[0-9]+$"
    Description: Numeric owner id ("owner" -> "id" at https://api.github.com/repos/OWNER/REPO)
  GitHubRepo:
    Type: String
    Default: cad-sis3
  GitHubRepoId:
    Type: String
    AllowedPattern: "^[0-9]+$"
    Description: Numeric repository id (top-level "id" at https://api.github.com/repos/OWNER/REPO)
  GitHubEnvironment:
    Type: String
    Default: production
  ProjectName:
    Type: String
    Default: sis3
    AllowedPattern: "^[a-z][a-z0-9-]{1,19}$"
    Description: Stack/resource prefix the pipeline is allowed to manage
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if IAM -> Identity providers already has token.actions.githubusercontent.com

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  # One per AWS account. No thumbprint: AWS no longer uses it for GitHub.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # ---------------------------------------------------------------
  # Role assumed by GitHub Actions. Trust = WHICH workflow, policy = WHAT it may do.
  # It cannot create VPCs, queues or tasks itself: it can only push the image and
  # hand templates to CloudFormation, which runs them as CfnExecutionRole.
  # ---------------------------------------------------------------
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "gha-deploy-${ProjectName}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                # Immutable subject format (repos created after 15 Jul 2026), pinned to the environment
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: deploy-through-cloudformation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageOnlyProjectStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                  - cloudformation:DeleteStack
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-*/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*"
              - Sid: PassOnlyTheExecutionRoleToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushOnlyToProjectRepo
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                  - ecr:DescribeImageScanFindings
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-app"
              - Sid: ReadServiceForTheRunSummary
                Effect: Allow
                Action: ecs:DescribeServices
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ProjectName}-cluster/*"

  # ---------------------------------------------------------------
  # CloudFormation service role: the only thing that creates the SIS 3 resources.
  # IAM is limited to roles whose names start with the project prefix
  # (CloudFormation names them <stack>-<LogicalId>-<random>).
  # ---------------------------------------------------------------
  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cfn-exec-${ProjectName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: sis3-resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ServicesUsedBySis3
                Effect: Allow
                Action:
                  - ec2:*
                  - elasticloadbalancing:*
                  - ecs:*
                  - ecr:*
                  - logs:*
                  - sns:*
                  - sqs:*
                  - lambda:*
                  - dynamodb:*
                Resource: "*"
              - Sid: ProjectRolesOnly
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:UpdateAssumeRolePolicy
                  - iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*"
              - Sid: ServiceLinkedRolesFirstUse
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com

Outputs:
  DeployRoleArn:
    Description: Put this into GitHub -> Settings -> Secrets and variables -> Actions -> Variables as DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  CfnExecutionRoleArn:
    Description: The workflow builds this ARN itself from the account id
    Value: !GetAtt CfnExecutionRole.Arn
  ExpectedSubject:
    Value: !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:${GitHubEnvironment}"
